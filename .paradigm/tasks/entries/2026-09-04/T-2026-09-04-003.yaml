blurb: 'Review security aspects of: Design (plan/spec only, do NOT write or edit any files) a wallet-abstraction architecture so that Claude Code agent sessions can perform e-commerce checkouts on behalf of users, using Circle Developer-Controlled Wallets (server-custodied, entity-secret based) for custody/signing and Arc (or other EVM chain via Circle) for USDC settlement. Constraints: current repo is a minimal Express+TS server (server/src/index.ts, db.ts) backed by Neon Postgres, no auth/wallet code yet exists. Must follow this repo''s Paradigm conventions (#component/^gate/!signal/ symbols, portal.yaml gates for protected routes, .purpose files). Must propose: (1) wallet custody model & where entity secret lives, (2) spending-policy/guardrails so an LLM agent can''t overspend (per-tx/daily caps, human confirmation for checkout), (3) checkout flow as a  spanning components (cart/order -> price check -> policy check -> Circle wallet transfer -> order confirmation), (4) which portal.yaml gates protect the checkout route, (5) webhook handling for async transaction settlement, (6) testnet-first rollout plan. Reviewer agent should flag security risks (agent-authorized fund movement, key custody, replay/idempotency).'
